[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filing-intel"
version = "0.1.0"
description = "An MCP-served, telemetry-instrumented multi-agent research platform over SEC EDGAR filings."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "httpx>=0.27",
    "mcp>=1.2",
    "langgraph>=1.0",
    # Retrieval over filing sections: numpy for the vectors, scikit-learn for
    # the TF-IDF and the SVD behind them. Core rather than an extra, because
    # `fetch_filing_section` takes the retrieval path whenever a query is given.
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "ruff>=0.7",
    # Exercises the Redis job store without a server, so the queue's
    # production path is tested rather than only its in-process fallback.
    "fakeredis>=2.23",
]

[project.scripts]
filing-intel-mcp = "filing_intel.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." puts the project root on sys.path so tests/test_evals.py can import the
# `evals` package. Relying on pytest's implicit rootdir insertion worked
# locally and failed in CI, because which directory pytest prepends depends on
# the pytest version and the invocation directory.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:filing_intel.*"]

# Branch coverage, with a floor CI enforces. The floor sits a couple of points
# under what the suite measures today: it is a ratchet against silent rot, not
# a target to game. Raise it when the suite earns it.
[tool.coverage.run]
source = ["filing_intel"]
branch = true

[tool.coverage.report]
fail_under = 92
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
