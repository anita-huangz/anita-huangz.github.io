[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curve-lab"
version = "0.1.0"
description = "Treasury curve analytics: PCA risk decomposition, carry and roll-down, and DV01- vs PCA-neutral curve trades."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "duckdb>=1.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# XGBoost is the predictive model the README reports on. It is optional
# because the honest finding is that it does not beat a random walk, and
# everything else in the package works without it.
predict = ["xgboost>=2.0"]
# The HTTP surface. Also optional: the library and the CLI do not import it.
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "xgboost>=2.0",
    # fastapi and httpx are what `TestClient` needs; the service suite is part
    # of the default run, so they belong in dev rather than behind an extra.
    "fastapi>=0.110",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.scripts]
curve-lab = "curve_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curve_lab = ["data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Branch coverage, with a floor CI enforces. The floor sits a couple of points
# under what the suite measures today: it is a ratchet against silent rot, not
# a target to game. Raise it when the suite earns it.
[tool.coverage.run]
source = ["curve_lab"]
branch = true

[tool.coverage.report]
fail_under = 94
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
