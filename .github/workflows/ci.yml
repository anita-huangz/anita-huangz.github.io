name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }} / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        project:
          - llm-platform/piano-arrangement-lab
          - llm-platform/sec-filing-intelligence

          - systems/card-game-system
          - systems/course-catalog
          - systems/fastcache
          - systems/trie-search

          - markets/bitcoin-and-asset-trading
          - markets/earnings-drift-tracker
          - markets/factor-based-portfolio-simulator
          - markets/stock-bond-portfolio-analysis
          - markets/yield-curve-lab

          - inference/customer-churn-prediction
          - inference/fake-news-detection
          - inference/global-security-threats
          - inference/personalized-recommendations-for-e-commerce
          - inference/weather-trends-and-forecast
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Lint the repository scripts
        # `ruff check .` above runs inside the project, so nothing was linting
        # the checkers in scripts/ that CI itself depends on.
        if: matrix.python-version == '3.13'
        working-directory: .
        run: ruff check scripts

      - name: Test
        # Every suite runs offline: no network, no API keys. The AI platform
        # uses its replay provider and fake data clients; the two quantitative
        # projects run on synthetic price paths.
        #
        # `--cov` reads its source and its floor from the project's pyproject,
        # so a drop below that floor fails the build. Coverage that quietly
        # rots is how a suite ends up measuring 97% of the modules it happens
        # to import -- which is exactly what these projects used to do.
        run: pytest -q --cov --cov-report=term-missing

      - name: Documentation matches the code
        # Run once rather than on all three interpreters: neither check depends
        # on the Python version, and three identical failures are noise.
        #
        # Test counts drift because they change on every commit; documented
        # flags drift because they never do, and nobody rereads a README to
        # check the parser still has what it promises. Both have gone wrong
        # here before.
        if: matrix.python-version == '3.13'
        working-directory: .
        run: |
          python scripts/check_test_counts.py "${{ matrix.project }}"
          python scripts/check_readme_flags.py "${{ matrix.project }}"

  site:
    name: portfolio site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm test -- --reporter=json --outputFile=../vitest.json
      - run: npm run build

      - name: Documented browser test count matches vitest
        working-directory: .
        run: |
          count=$(python3 -c "import json;print(json.load(open('vitest.json'))['numTotalTests'])")
          python3 scripts/check_test_counts.py --browser "$count"

  curve-api:
    name: curve-lab API + client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markets/yield-curve-lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: BFF
        # Its tests fake the engine, so none of this needs Python running.
        run: |
          cd api
          npm install
          npx tsc -b --noEmit
          npm test -- --reporter=json --outputFile=../../../api-tests.json

      - name: Documented API test count matches the suite
        working-directory: .
        run: |
          count=$(python3 -c "import json;print(json.load(open('api-tests.json'))['numTotalTests'])")
          python3 scripts/check_test_counts.py --api "$count"

      - name: Client
        run: |
          cd web
          npm install
          npx tsc -b --noEmit
          npm run build

  web:
    name: web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-platform/sec-filing-intelligence/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: llm-platform/sec-filing-intelligence/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the AI platform image
        run: docker build -t filing-intel:ci llm-platform/sec-filing-intelligence

      - name: Build the curve-lab images
        # Two targets from one Dockerfile: the Python engine and the Node BFF
        # that serves the built client in front of it.
        run: |
          docker build --target engine -t curve-lab-engine:ci markets/yield-curve-lab
          docker build --target api -t curve-lab-api:ci markets/yield-curve-lab
