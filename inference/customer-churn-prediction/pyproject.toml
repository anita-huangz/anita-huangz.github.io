[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Survival analysis and decision modelling for customer churn."
requires-python = ">=3.11"
# scipy is imported directly by survival.py, not just pulled in behind
# scikit-learn. It arrives either way today, but a package that imports a
# module it does not declare is one dependency bump away from not.
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "scipy>=1.11"]

[project.optional-dependencies]
# statsmodels is a *test* dependency only: the Cox and Kaplan-Meier
# implementations here are from scratch, and the tests check them against
# statsmodels' independent ones. Shipping it as a runtime dependency would
# defeat the point of writing them.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7", "statsmodels>=0.14"]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Branch coverage, with a floor CI enforces. The floor sits a couple of points
# under what the suite measures today: it is a ratchet against silent rot, not
# a target to game. Raise it when the suite earns it.
[tool.coverage.run]
source = ["churn"]
branch = true

[tool.coverage.report]
fail_under = 94
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The original notebook is kept as the record of what this replaced, not as
# code to maintain. Ruff does have opinions about it -- including two
# `F821 Undefined name` findings that are the real bugs the README describes --
# but it is not going to be brought up to standard, it is being superseded.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
